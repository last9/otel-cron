name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # First release per line with the eMudhra blocklist (nodejs/node#66871);
        # keep in step with engines.node (test/node-versions.test.ts).
        node: ['22.23.4', '24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: TLS probe (eMudhra chain rejected, trusted host accepted)
        run: node scripts/tls-probe.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
